<svg xmlns="http://www.w3.org/2000/svg" width="460" height="452" viewBox="0 0 460 452" role="img" aria-label="结果行的右键动作菜单，共 10 项">
  <defs>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="460" height="452" fill="#f1f5f9"/>
  <text x="30" y="34" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">右键 7897 那一行 → 全部动作</text>

  <g filter="url(#card)">
    <rect x="30" y="48" width="400" height="380" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  </g>

  <!-- 三个有快捷键的动作 -->
  <text x="52" y="82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" fill="#0f172a">结束进程</text>
  <rect x="286" y="66" width="122" height="22" rx="5" fill="#eff6ff" stroke="#dbeafe"/>
  <text x="347" y="81" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="11" fill="#1d4ed8">Enter</text>

  <text x="52" y="116" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" fill="#0f172a">连同子进程</text>
  <rect x="286" y="100" width="122" height="22" rx="5" fill="#eff6ff" stroke="#dbeafe"/>
  <text x="347" y="115" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="11" fill="#1d4ed8">Ctrl+Enter</text>

  <text x="52" y="150" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" fill="#0f172a">复制命令行</text>
  <rect x="286" y="134" width="122" height="22" rx="5" fill="#eff6ff" stroke="#dbeafe"/>
  <text x="347" y="149" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="11" fill="#1d4ed8">Shift+Enter</text>

  <line x1="46" y1="172" x2="414" y2="172" stroke="#e2e8f0"/>

  <!-- 其余动作：仅菜单 -->
  <text x="52" y="200" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" fill="#0f172a">复制 PID</text>
  <text x="52" y="232" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" fill="#0f172a">复制路径</text>
  <text x="52" y="264" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" fill="#0f172a">复制整行（netstat 形式）</text>
  <text x="52" y="296" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" fill="#0f172a">复制父进程链</text>

  <line x1="46" y1="314" x2="414" y2="314" stroke="#e2e8f0"/>

  <text x="52" y="342" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" fill="#0f172a">打开所在目录</text>
  <text x="52" y="374" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" fill="#0f172a">在资源管理器中定位</text>
  <text x="52" y="406" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" fill="#b91c1c">以管理员结束（UAC）</text>

  <text x="30" y="448" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#94a3b8">宿主只有 Enter / Ctrl+Enter / Shift+Enter 三个键位，其余动作只在菜单里</text>
</svg>
